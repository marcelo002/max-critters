<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Critters">
<meta name="theme-color" content="#1d2a6b">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Max's Number Critters</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/*
VOICE: playful, warm, celebratory; a bright 5-year-old who reads well
IDEA: a critter-collector's adventure: answer questions, earn coins, open packs, fill the Critter Book
PICTURE: each game's puzzle drawn large on a cream panel; 120 original hand-built SVG critters
COLOUR and TYPE: deep evening-blue field, candy-bright keys, rarity colours grey/green/blue/violet/gold; Baloo 2
LAYOUT: one screen at a time (home, games, play, packs, book); big targets; grown-up stats behind a held gear
*/
:root{color-scheme:dark;--bg:#1d2a6b;--bg2:#2b3c8f;--panel:#fffaf0;--pink:#ff7bac;--add:#ffc93c;--sub:#4cc9f0;--mul:#ff6b6b;--div:#8ac926;--dark:#16204f;
--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:radial-gradient(120% 80% at 50% 0%,var(--bg2),var(--bg) 60%,#141d4d);color:#fff;
font:600 18px/1.3 "Baloo 2",ui-rounded,"SF Pro Rounded",system-ui,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:4px solid #fff;outline-offset:3px}
#sky{position:fixed;inset:0;pointer-events:none;overflow:hidden}
#sky i{position:absolute;width:4px;height:4px;border-radius:50%;background:#fff;opacity:.5;animation:tw 3s ease-in-out infinite}
#sky .hill{position:absolute;bottom:-30vh;left:-10vw;width:120vw;height:50vh;border-radius:50%;background:#24357f}
#sky .hill.b{left:30vw;bottom:-34vh;background:#2a3d8c}
@keyframes tw{50%{opacity:1;transform:scale(1.6)}}
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;gap:10px;padding:calc(var(--safe-t) + 14px) max(3vw,14px) calc(var(--safe-b) + 14px)}
.screen.on{display:flex}
h1{font-size:clamp(40px,7vw,72px);line-height:1.02;margin:0;text-align:center;font-weight:800;text-wrap:balance;text-shadow:0 5px 0 #0f1740}
h1 b{color:var(--add)}
h2{font-size:clamp(26px,4vw,40px);line-height:1.05;margin:0;font-weight:800;text-shadow:0 4px 0 #0f1740}
h3{margin:14px 0 6px;font-size:24px;font-weight:800}
.top{width:100%;max-width:1200px;display:flex;align-items:center;gap:10px}
.top .ttl{flex:1;text-align:center;display:flex;flex-direction:column;align-items:center;line-height:1.05}
.top .ttl small{font-size:16px;opacity:.85}
.icon{width:60px;height:60px;border-radius:20px;background:#ffffff1f;display:grid;place-items:center;flex:none;box-shadow:inset 0 -4px 0 #0003}
.icon svg{width:32px;height:32px}
.icon:active{transform:translateY(2px)}
.coins{display:flex;align-items:center;gap:6px;background:#0004;border-radius:999px;padding:4px 14px 4px 6px;font-size:24px;font-weight:800;flex:none;min-height:48px}
.coins svg{width:34px;height:34px}
.coins.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.25)}}
.big{display:flex;align-items:center;justify-content:center;gap:12px;min-height:80px;padding:0 34px;border-radius:999px;font-size:clamp(24px,3.4vw,34px);font-weight:800;
color:#2a1600;background:var(--add);box-shadow:0 8px 0 #c48a00,0 14px 24px #0005}
.big:active{transform:translateY(6px);box-shadow:0 2px 0 #c48a00}
.big.alt{background:#fff;color:var(--dark);box-shadow:0 8px 0 #b9c0e8,0 14px 24px #0005}
.big[disabled]{opacity:.45}
.row{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
/* home */
#home{justify-content:center;gap:clamp(12px,2.6vh,26px)}
#homeTop{position:absolute;top:calc(var(--safe-t) + 14px);left:max(3vw,14px);right:max(3vw,14px);display:flex;justify-content:space-between}
#parade{display:flex;align-items:flex-end;justify-content:center;gap:clamp(4px,2vw,20px);height:clamp(130px,25vh,230px)}
#parade svg{height:100%;width:auto;animation:bob 2.4s ease-in-out infinite}
#parade svg:nth-child(2){animation-delay:.4s;height:115%}#parade svg:nth-child(3){animation-delay:.8s}
@keyframes bob{50%{transform:translateY(-10px)}}
.hint{font-size:17px;opacity:.8;text-align:center}
#gear.hold{background:conic-gradient(var(--add) var(--p,0%),#ffffff1f 0)}
/* games menu */
.scroll{flex:1;width:100%;max-width:1200px;overflow:auto;-webkit-overflow-scrolling:touch;padding:4px 4px 20px}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.gcard{border-radius:26px;padding:14px;display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;min-height:150px;
box-shadow:inset 0 -6px 0 #0003,0 8px 18px #0004;color:#fff}
.gcard .gi{font-size:40px;font-weight:800;line-height:1;background:#fff3;border-radius:16px;padding:6px 12px;min-width:64px;text-align:center}
.gcard .gn{font-size:24px;font-weight:800;line-height:1.05;margin-top:4px}
.gcard .gl{font-size:16px;opacity:.9}
.pbar{display:flex;gap:4px}.pbar i{width:16px;height:16px;border-radius:50%;background:#0003}.pbar i.on{background:var(--add)}
/* play */
#gBody{flex:1;width:100%;max-width:1100px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;min-height:0}
.panel{width:100%;background:var(--panel);border-radius:34px;padding:clamp(14px,2.6vw,30px) clamp(10px,2vw,26px);box-shadow:inset 0 -10px 0 #e8dcc2,0 18px 40px #0006;
color:var(--dark);display:flex;flex-direction:column;align-items:center;gap:14px}
#msg{font-size:clamp(20px,2.8vw,28px);font-weight:800;min-height:1.3em;text-align:center;color:var(--dark)}
.q{font-size:clamp(24px,3.4vw,36px);font-weight:800;text-align:center;line-height:1.2;text-wrap:balance}
.bigq{font-size:clamp(44px,8vw,84px);font-weight:800;line-height:1;text-align:center;letter-spacing:2px}
.blank{display:inline-block;min-width:1.3em;border-radius:18px;background:#ffe3ef;color:var(--pink);border:4px dashed var(--pink);padding:0 .1em}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;width:100%;max-width:760px}
.ch{min-height:86px;border-radius:24px;background:#fff;color:var(--dark);font-size:clamp(26px,3.6vw,40px);font-weight:800;box-shadow:0 7px 0 #c7cde8;padding:8px 12px;line-height:1.1;
display:flex;align-items:center;justify-content:center;gap:8px}
.ch.word{font-size:clamp(22px,3vw,30px)}
.ch:active{transform:translateY(5px);box-shadow:0 2px 0 #c7cde8}
.ch.no{background:#ffd9d9;color:#c53030;box-shadow:0 7px 0 #f2a5a5;opacity:.6}
.ch.yes{background:#c8f7c5;color:#1b6b2a;box-shadow:0 7px 0 #8fd88a}
.ch svg{width:56px;height:56px}
.shake{animation:shake .5s}
@keyframes shake{20%,60%{transform:translateX(-12px)}40%,80%{transform:translateX(12px)}}
/* symbol game */
#eq{display:flex;align-items:flex-start;justify-content:center;gap:calc(var(--t)*.12);--t:100px}
.cell{display:flex;flex-direction:column;align-items:center;gap:6px}
.num,.slot,.eqs{width:var(--t);height:var(--t);border-radius:calc(var(--t)*.26);display:grid;place-items:center;font-size:calc(var(--t)*.6);font-weight:800;line-height:1}
.num{background:#fff;box-shadow:inset 0 -6px 0 #dfe3f5,0 4px 0 #c7cde8}
.num.res{background:var(--dark);color:#fff;box-shadow:inset 0 -6px 0 #0b1236}
.eqs{width:calc(var(--t)*.55);color:#7d86b8}
.slot{border:calc(var(--t)*.05) dashed #aab1d6;background:#f3f1ff;color:#fff}
.slot.act{border-color:var(--pink);border-style:solid;animation:glow 1.1s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 8px #ff7bac55}}
.slot.f{border:0;box-shadow:inset 0 -6px 0 #0002;animation:pop .25s}
.slot.hintd{box-shadow:0 0 0 4px #fff,0 0 0 9px var(--add)}
@keyframes pop{0%{transform:scale(.5)}70%{transform:scale(1.12)}}
.dots{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;width:calc(var(--t)*.8)}.dots i{aspect-ratio:1;border-radius:50%;background:#ff9f1c}
.keys{display:flex;gap:clamp(12px,3vw,28px);justify-content:center}
.key{width:clamp(90px,12vw,128px);height:clamp(90px,12vw,128px);border-radius:30px;font-size:clamp(60px,8.5vw,86px);font-weight:800;line-height:1;color:#fff;display:grid;place-items:center;padding-bottom:6px}
.key:active{transform:translateY(7px)}
.k\+{background:var(--add);box-shadow:0 9px 0 #c48a00;color:#2a1600}.k-{background:var(--sub);box-shadow:0 9px 0 #1b8db3}
.k\*{background:var(--mul);box-shadow:0 9px 0 #c73d3d}.k\/{background:var(--div);box-shadow:0 9px 0 #5e8f12}
/* tiles (target, word builder) */
.tiles{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;max-width:760px}
.tile{width:clamp(70px,10vw,96px);height:clamp(70px,10vw,96px);border-radius:22px;background:#fff;color:var(--dark);font-size:clamp(32px,5vw,48px);font-weight:800;box-shadow:0 7px 0 #c7cde8;display:grid;place-items:center}
.tile.sel{background:var(--add);box-shadow:0 7px 0 #c48a00;transform:translateY(-4px)}
.tile.gone{visibility:hidden}
.tile.glow{animation:glow 1.1s infinite}
.slots{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.lslot{width:clamp(52px,8vw,80px);height:clamp(62px,9vw,90px);border-radius:16px;border:4px dashed #aab1d6;background:#f3f1ff;font-size:clamp(32px,5vw,48px);font-weight:800;display:grid;place-items:center;color:var(--dark)}
.lslot.f{border-style:solid;border-color:var(--sub);background:#e3f8ff}.lslot.lock{border-color:var(--add);background:#fff4cc}
.sum{font-size:26px;font-weight:800}
/* story */
.story{background:#fff;border-radius:22px;padding:14px 20px;font-size:clamp(19px,2.3vw,24px);line-height:1.45;max-width:820px;max-height:36vh;overflow:auto;box-shadow:inset 0 -4px 0 #e6e9f7}
.story b{display:block;font-size:1.1em;margin-bottom:4px}
/* match */
.mcols{display:grid;grid-template-columns:1fr 1fr;gap:12px 40px;width:100%;max-width:700px}
.mw{min-height:66px;border-radius:20px;background:#fff;color:var(--dark);font-size:clamp(22px,3vw,30px);font-weight:800;box-shadow:0 6px 0 #c7cde8}
.mw.sel{background:var(--add);box-shadow:0 6px 0 #c48a00}.mw.done{background:#c8f7c5;color:#1b6b2a;box-shadow:none;opacity:.7}
/* scale, number line */
.fig{width:100%;max-width:760px}.fig svg{width:100%;height:auto;display:block}
/* shop */
.packs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;width:100%}
.pack{background:var(--panel);color:var(--dark);border-radius:28px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:inset 0 -6px 0 #e8dcc2}
.pack svg{width:120px;height:auto}
.pack .pn{font-size:26px;font-weight:800;line-height:1}
.odds{width:100%;font-size:14px;line-height:1.35}
.odds div{display:flex;justify-content:space-between;gap:8px}
.odds span:first-child{display:flex;align-items:center;gap:6px}
.odds i{width:12px;height:12px;border-radius:50%;display:inline-block}
.buy{min-height:60px;width:100%;border-radius:999px;background:var(--add);box-shadow:0 6px 0 #c48a00;font-size:24px;font-weight:800;color:#2a1600;display:flex;align-items:center;justify-content:center;gap:6px}
.buy svg{width:28px;height:28px}
.buy[disabled]{background:#ddd;box-shadow:0 6px 0 #bbb;color:#777}
/* book */
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:100%;max-width:1200px}
.chip{min-height:44px;padding:0 14px;border-radius:999px;background:#ffffff22;font-size:17px;font-weight:800}
.chip.on{background:#fff;color:var(--dark)}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.mc{background:var(--panel);color:var(--dark);border-radius:20px;padding:8px 8px 10px;display:flex;flex-direction:column;align-items:center;text-align:center;border:5px solid var(--r);position:relative}
.mc svg{width:100%;max-width:110px;height:auto}
.mc .nm{font-size:17px;font-weight:800;line-height:1.05}
.mc .rr{font-size:13px;color:var(--r);font-weight:800;filter:brightness(.8)}
.mc.no svg{filter:brightness(0);opacity:.2}
.mc .x{position:absolute;top:4px;right:6px;background:var(--dark);color:#fff;font-size:13px;border-radius:999px;padding:0 7px}
/* overlays */
.ov{position:fixed;inset:0;background:#0b1236e6;display:none;align-items:center;justify-content:center;z-index:5;padding:16px}
.ov.on{display:flex}
.box{background:var(--panel);color:var(--dark);border-radius:34px;padding:22px 24px 24px;max-width:600px;width:100%;max-height:100%;overflow:auto;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;box-shadow:0 20px 60px #000a}
.box h2{text-shadow:none}
.box.wide{max-width:1000px;text-align:left;align-items:stretch}
#openRow{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.flip{width:clamp(120px,var(--fw,26vw),220px);aspect-ratio:3/4;perspective:800px}
.flip .in{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.flip.open .in{transform:rotateY(180deg)}
.flip .fa,.flip .ba{position:absolute;inset:0;border-radius:22px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px}
.flip .fa{background:repeating-linear-gradient(45deg,#3b54c4 0 14px,#2c43a8 14px 28px);border:5px solid #fff;color:#fff;font-size:60px;font-weight:800}
.flip .ba{transform:rotateY(180deg);background:#fff;border:6px solid var(--r);color:var(--dark)}
.flip .ba svg{width:90%;height:auto}
.flip .ba .nm{font-size:20px;font-weight:800;line-height:1}
.flip .ba .rr{font-size:15px;font-weight:800;color:var(--r);filter:brightness(.8)}
.flip .ba .tag{font-size:14px;font-weight:800;border-radius:999px;padding:0 10px;background:var(--pink);color:#fff}
.flip .ba .tag.d{background:#e5e7f2;color:var(--dark)}
.flip.glowL .ba{box-shadow:0 0 30px 8px #f6ad1e}
.opt{width:100%;min-height:56px;border-radius:18px;background:#eef0fb;font-size:20px;font-weight:700;display:flex;align-items:center;justify-content:space-between;padding:0 18px;color:var(--dark);gap:10px;text-align:left}
.opt b{font-weight:800}.opt.warn{background:#ffe1e1;color:#9b1c1c}
.small{font-size:14px;opacity:.75;line-height:1.35}
table{border-collapse:collapse;width:100%;font-size:16px}
th,td{padding:6px 8px;border-bottom:1px solid #e3e0d5;text-align:left;white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.pct{display:inline-block;min-width:54px;border-radius:999px;padding:0 8px;text-align:center;font-weight:800}
.lv{display:inline-flex;align-items:center;gap:6px}.lv button{width:36px;height:36px;border-radius:10px;background:#e5e7f2;font-weight:800}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tabs button{min-height:44px;padding:0 16px;border-radius:999px;background:#e5e7f2;font-weight:800;color:var(--dark)}
.tabs button.on{background:var(--dark);color:#fff}
.tscroll{overflow-x:auto}
.rays{transform-origin:60px 64px;animation:spin 16s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.flip.glowL.open .ba{animation:legend 1.4s ease-out}@keyframes legend{0%{box-shadow:0 0 0 0 #ffd23f;transform:rotateY(180deg) scale(.8)}50%{box-shadow:0 0 80px 40px #ffd23f;transform:rotateY(180deg) scale(1.08)}}
.tier{font-size:14px;font-weight:800;color:#c48a00}
#fx{position:fixed;inset:0;pointer-events:none;z-index:9;overflow:hidden}
#fx i{position:absolute;width:14px;height:20px;border-radius:4px;top:-30px;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(720deg)}}
#toast{position:fixed;left:50%;top:calc(var(--safe-t) + 80px);transform:translateX(-50%);background:var(--add);color:#2a1600;font-size:26px;font-weight:800;border-radius:999px;padding:6px 22px;z-index:8;display:none;box-shadow:0 8px 20px #0006}
#toast.on{display:block;animation:pop .3s}
@media (max-width:700px){.choices{gap:10px}.ch{min-height:70px}.top .ttl h2{font-size:24px}.mcols{gap:10px 16px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="sky"><div class="hill"></div><div class="hill b"></div></div>

<section class="screen on" id="home">
  <div id="homeTop"><div class="coins" data-coins></div><button class="icon" id="gear" aria-label="Grown-ups: press and hold"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg></button></div>
  <div id="parade"></div>
  <h1>Max's <b>Number</b> Critters</h1>
  <div class="hint" id="homeHint"></div>
  <div class="row">
    <button class="big" data-go="menu">▶ Play</button>
    <button class="big alt" data-go="shop">Packs</button>
    <button class="big alt" data-go="book">Critter Book</button>
  </div>
</section>

<section class="screen" id="menu">
  <div class="top"><button class="icon" data-go="home" aria-label="Home"><svg viewBox="0 0 24 24" fill="#fff"><path d="M12 3 2 12h3v8h5v-5h4v5h5v-8h3z"/></svg></button><div class="ttl"><h2>Pick a game</h2></div><div class="coins" data-coins></div></div>
  <div class="scroll"><h3>Math games</h3><div class="ggrid" id="gMath"></div><h3>Reading games</h3><div class="ggrid" id="gRead"></div></div>
</section>

<section class="screen" id="game">
  <div class="top">
    <button class="icon" data-go="menu" aria-label="Back to games"><svg viewBox="0 0 24 24" fill="#fff"><path d="M15 4 7 12l8 8 2-2-6-6 6-6z"/></svg></button>
    <div class="ttl"><h2 id="gTitle"></h2><small id="gLevel"></small></div>
    <div class="coins" data-coins></div>
    <button class="icon" id="readBtn" aria-label="Read it to me"><svg viewBox="0 0 24 24" fill="#fff"><path d="M4 9v6h4l5 4V5L8 9zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg></button>
  </div>
  <div id="gBody"></div>
</section>

<section class="screen" id="shop">
  <div class="top"><button class="icon" data-go="home" aria-label="Home"><svg viewBox="0 0 24 24" fill="#fff"><path d="M12 3 2 12h3v8h5v-5h4v5h5v-8h3z"/></svg></button><div class="ttl"><h2>Critter Packs</h2><small>Bigger packs have more critters and find rarer ones.</small></div><div class="coins" data-coins></div></div>
  <div class="scroll"><div class="packs" id="packs"></div></div>
</section>

<section class="screen" id="book">
  <div class="top"><button class="icon" data-go="home" aria-label="Home"><svg viewBox="0 0 24 24" fill="#fff"><path d="M12 3 2 12h3v8h5v-5h4v5h5v-8h3z"/></svg></button><div class="ttl"><h2 id="bookTitle">Critter Book</h2></div><div class="coins" data-coins></div></div>
  <div class="chips" id="chips"></div>
  <div class="scroll"><div class="bgrid" id="bgrid"></div></div>
</section>

<div class="ov" id="openOv"><div class="box" style="max-width:1120px">
  <h2 id="openTitle">Tap the cards!</h2>
  <div id="openRow"></div>
  <div id="openSum" class="small"></div>
  <div class="row"><button class="big" id="openDone" style="display:none">Yay!</button><button class="big alt" id="openAgain" style="display:none">Open another</button></div>
</div></div>

<div class="ov" id="lvlOv"><div class="box">
  <div id="lvlArt" style="width:200px"></div>

function prec(ns,os){const t=[ns[0]],ad=[];let exact=true;for(let i=0;i<os.length;i++){const b=ns[i+1],o=os[i],L=t.length-1;
 if(o=='*')t[L]*=b;else if(o=='/'){if(b===0)return null;if(!Number.isInteger(t[L]/b))exact=false;t[L]/=b}else{ad.push(o);t.push(b)}}

 if(L.need&&!os.some(o=>L.need.includes(o)))continue;const a=ltr(ns,os),p=prec(ns,os);if(!a||!p||!p.exact||a.neg||p.neg||a.v!==p.v)continue;
 const t=p.v;if(t<0||t>L.tmax)continue;const key=ns.join()+'='+t;if(recent.includes(key))continue;let ok=true;const ans=[];
 for(const c of combos(L.n-1,L.ops)){const pc=prec(ns,c),lc=ltr(ns,c);const pv=pc&&Math.abs(pc.v-t)<1e-9,lv=lc&&lc.v===t;
  if(pv&&pc.exact&&lv&&!pc.neg&&!lc.neg)ans.push(c.join(''));else if(pv||lv){ok=false;break}}

function openGame(k){G=GKEY[k];show('game');$('#gTitle').textContent=G.name;nextRound()}
function drawHead(){const st=gs(G.key);$('#gLevel').innerHTML=`Level ${st.lvl} of ${G.max} &nbsp;<span class="pbar" style="display:inline-flex;vertical-align:middle">${Array.from({length:5},(_,i)=>`<i class="${i<st.prog?'on':''}"></i>`).join('')}</span>`}
function nextRound(){const st=gs(G.key);R=G.make(st.lvl);miss=0;usedHint=false;busy=false;drawHead();const el=$('#gBody');el.innerHTML='';
 if(R.mount)R.mount(el,api);
 else{el.innerHTML=`<div class="panel"><div id="msg"></div>${R.q}<div class="choices">${R.choices.map((c,i)=>`<button class="ch${c.w?' word':''}" data-i="${i}">${c.h}</button>`).join('')}</div></div>`;
  if(R.init)R.init();
  el.querySelectorAll('.ch').forEach(b=>b.onclick=()=>{if(busy||b.disabled)return;ac();const c=R.choices[+b.dataset.i];
   if(c.ok){busy=true;b.classList.add('yes');win()}else{b.classList.add('no');b.disabled=true;lose(b.textContent||'(shape)');
    if(miss>=2){const wrong=[...el.querySelectorAll('.ch:not(.no)')].filter(x=>!R.choices[+x.dataset.i].ok);if(wrong.length>1){wrong[0].classList.add('no');wrong[0].disabled=true;usedHint=true}}}});
  R.cheat=()=>{const i=R.choices.findIndex(c=>c.ok);el.querySelectorAll('.ch')[i].click()}}}
function stat(ok){const k=G.key,l=gs(k).lvl;S.stats[k]=S.stats[k]||{};const s=S.stats[k][l]=S.stats[k][l]||{n:0,first:0,wrong:0,hint:0,tags:{}};
 s.n++;if(miss===0)s.first++;s.wrong+=miss;if(usedHint)s.hint++;if(R.tag){const t=s.tags[R.tag]=s.tags[R.tag]||[0,0];t[0]++;if(miss===0)t[1]++}}
const PRAISE=['Great job!','You got it!','Awesome!','Super smart!','Nice work!','Wow, correct!','Brilliant!'];
function win(){busy=true;const st=gs(G.key);stat(true);const c=miss===0?5:miss===1?3:1;S.coins+=c;S.total++;st.solved++;st.prog++;SFX.good();confetti(20);
 const p=pick(PRAISE);const m=$('#msg');if(m){m.textContent=`${p} +${c} coins`;m.style.color='#2f9e44'}say(p);setTimeout(()=>{SFX.coin();drawCoins(true)},300);
 if(R.after)R.after();let up=false;if(st.prog>=5){st.prog=0;if(st.lvl<G.max){st.lvl++;up=true}S.coins+=up?20:10}
 save();drawHead();
 setTimeout(()=>{if(st.prog===0){drawCoins(true);levelUp(up,st.lvl)}else nextRound()},R.after?2100:1500)}
function lose(g){miss++;SFX.bad();const m=$('#msg');if(m){m.textContent=miss>=2?'Here is a little help!':'Not quite. Try again!';m.style.color='#c2410c'}
 const p=document.querySelector('#eq,.mcols,.slots,.tiles');if(p){p.classList.remove('shake');void p.offsetWidth;p.classList.add('shake')}
 S.log.unshift({t:Date.now(),g:G.key,l:gs(G.key).lvl,q:R.txt||'',a:String(g||'').slice(0,40)});if(S.log.length>60)S.log.length=60;save()}
function levelUp(up,l){SFX.fanfare();confetti(50);const owned=Object.keys(S.owned).map(Number);const pk=owned.length?pick(owned):0;$('#lvlArt').innerHTML=art(pk,tierOf(S.owned[pk]|0));
 $('#lvlTitle').textContent=up?`Level ${l}!`:'5 in a row!';$('#lvlText').innerHTML=`${up?`You reached level ${l} in ${esc(G.name)}.`:`You finished another round of ${esc(G.name)}.`} Bonus: <b>+${up?20:10} coins</b>!`;
 say(up?`Level up! Level ${l}!`:'Bonus coins!');$('#lvlOv').classList.add('on')}
$('#lvlGo').onclick=()=>{SFX.tap();$('#lvlOv').classList.remove('on');nextRound()};
$('#readBtn').onclick=()=>{ac();const t=typeof R.say==='function'?R.say():R.say;say(t||'',true)};

/* =============== screens =============== */
function show(id){$$('.screen').forEach(s=>s.classList.toggle('on',s.id===id));drawCoins();if(id==='home')drawHome();if(id==='menu')drawMenu();if(id==='shop')drawShop();if(id==='book')drawBook()}
$$('[data-go]').forEach(b=>b.onclick=()=>{ac();SFX.tap();show(b.dataset.go)});
function refresh(){const on=$('.screen.on');if(on&&on.id!=='game')show(on.id);drawCoins()}
function drawHome(){const owned=Object.keys(S.owned).map(Number).sort((a,b)=>(MON[b].rar*3+tierOf(S.owned[b]))-(MON[a].rar*3+tierOf(S.owned[a])));const p=owned.slice(0,3);
 $('#parade').innerHTML=(p.length?p:[0,13,26]).map(i=>art(i,tierOf(S.owned[i]|0))).join('');if(!p.length)$('#parade').style.opacity=.5;else $('#parade').style.opacity=1;
 $('#homeHint').textContent=owned.length?`You have ${owned.length} of ${MON.length} critters. Play games to earn coins, then open packs!`:'Play games to earn coins, then open packs to collect critters!'}
function drawMenu(){const card=g=>{const st=gs(g.key);return `<button class="gcard" data-g="${g.key}" style="background:${g.bg}"><span class="gi">${g.icon}</span><span class="gn">${g.name}</span><span class="gl">Level ${st.lvl} of ${g.max}</span><span class="pbar">${Array.from({length:5},(_,i)=>`<i class="${i<st.prog?'on':''}"></i>`).join('')}</span></button>`};
 $('#gMath').innerHTML=GAMES.filter(g=>g.kind=='math').map(card).join('');$('#gRead').innerHTML=GAMES.filter(g=>g.kind=='read').map(card).join('');
 $$('.gcard').forEach(b=>b.onclick=()=>{ac();SFX.tap();openGame(b.dataset.g)})}

/* =============== packs =============== */
const PACKS=[{n:'Starter',cards:3,cost:25,odds:[70,22,7,1,0],col:['#9aa5b1','#d6dde6']},{n:'Super',cards:3,cost:75,odds:[45,32,16,6,1],col:['#3fbf6a','#b8f0c9']},
 {n:'Mega',cards:4,cost:200,odds:[15,30,32,17,6],min:2,col:['#3b8eea','#bcdcff']},{n:'Legend',cards:5,cost:500,odds:[0,15,40,30,15],min:3,col:['#f6ad1e','#ffe6a8']}];
function packArt(p){return `<svg viewBox="0 0 100 130"><path d="M14 10h72l-4 8 4 8v84l-4 8 4 8H14l4-8-4-8V26l4-8z" fill="${p.col[0]}"/><path d="M22 30h56v70H22z" fill="${p.col[1]}" opacity=".7"/>
 <path d="m50 42 6 14h15l-12 9 5 15-14-9-14 9 5-15-12-9h15z" fill="#fff"/><text x="50" y="96" text-anchor="middle" font-size="13" font-weight="800" fill="#16204f" font-family="Baloo 2,system-ui">${p.n.toUpperCase()}</text></svg>`}
function drawShop(){$('#packs').innerHTML=PACKS.map((p,i)=>`<div class="pack">${packArt(p)}<div class="pn">${p.n} Pack</div><div style="font-weight:800">${p.cards} critters</div>
 <div class="odds">${p.odds.map((o,r)=>o?`<div><span><i style="background:${RAR[r].c}"></i>${RAR[r].n}</span><span>${o}%</span></div>`:'').join('')}${p.min?`<div class="small">At least one ${RAR[p.min].n} or better!</div>`:''}</div>
 <button class="buy" data-p="${i}" ${S.coins<p.cost?'disabled':''}>${COIN}${p.cost}</button>${S.coins<p.cost?`<div class="small">${p.cost-S.coins} more coins</div>`:''}</div>`).join('');
 $$('.buy').forEach(b=>b.onclick=()=>{ac();buy(+b.dataset.p)})}
function rollRar(odds){let r=Math.random()*100;for(let i=0;i<5;i++){r-=odds[i];if(r<0)return i}return 0}
function pickMon(rar){const pool=MON.filter(m=>m.rar===rar);const w=pool.map(m=>S.owned[m.id]?1:3);let r=Math.random()*w.reduce((a,b)=>a+b);for(let i=0;i<pool.length;i++){r-=w[i];if(r<0)return pool[i].id}return pool[0].id}
let lastPack=0;
function buy(pi){const p=PACKS[pi];if(S.coins<p.cost){SFX.bad();return}lastPack=pi;S.coins-=p.cost;S.packs++;const rars=Array.from({length:p.cards},()=>rollRar(p.odds));
 if(p.min&&Math.max(...rars)<p.min)rars[rars.length-1]=p.min;const got=rars.map(r=>{const id=pickMon(r);const isNew=!S.owned[id];S.owned[id]=(S.owned[id]|0)+1;const n=S.owned[id];let refund=0;if(n>6){refund=5;S.coins+=5}return{id,isNew,refund,n}});
 save();drawCoins(true);SFX.tap();openPack(got)}
function dupeMsg(g){const n=g.n;if(n==3)return'Shiny unlocked! ✨';if(n==6)return'Golden unlocked! ★';if(n<3)return`Copy ${n} of 3 to Shiny`;if(n<6)return`Copy ${n} of 6 to Golden`;return`Golden already! +${g.refund} coins`}
function openPack(got){let opened=0;$('#openTitle').textContent='Tap each card to flip it!';$('#openSum').textContent='';$('#openDone').style.display='none';$('#openAgain').style.display='none';
 $('#openRow').style.setProperty('--fw',got.length>3?'17vw':'26vw');$('#openRow').innerHTML=got.map((g,i)=>{const m=MON[g.id];return `<button class="flip${m.rar==4?' glowL':''}" data-i="${i}" style="--r:${RAR[m.rar].c}"><div class="in"><div class="fa">?</div><div class="ba">${art(g.id,tierOf(g.n))}<div class="nm">${esc(m.name)}</div><div class="rr">${RAR[m.rar].n}</div>${g.isNew?'<div class="tag">NEW!</div>':`<div class="tag${g.n==3||g.n==6?'':' d'}">${dupeMsg(g)}</div>`}</div></div></button>`}).join('');
 $$('#openRow .flip').forEach(b=>b.onclick=()=>{if(b.classList.contains('open'))return;b.classList.add('open');opened++;const g=got[+b.dataset.i],m=MON[g.id];
  if(m.rar>=3){SFX.fanfare();confetti(m.rar==4?80:40)}else if(g.isNew)SFX.good();else SFX.flip();if(g.n==3||g.n==6)say(`${m.name} is now ${TIER[tierOf(g.n)]}!`);else if(g.isNew&&m.rar>=2)say(`Wow! A ${RAR[m.rar].n.toLowerCase()} critter: ${m.name}!`);
  if(opened===got.length){const n=got.filter(g=>g.isNew).length,up=got.filter(g=>g.n==3||g.n==6).length;$('#openTitle').textContent=n?`${n} new critter${n>1?'s':''}!`:up?'Your critters powered up!':'Repeats help your critters power up!';
   $('#openSum').textContent='Collect 3 copies of a critter to make it Shiny, and 6 to make it Golden.';$('#openDone').style.display='';$('#openAgain').style.display=S.coins>=PACKS[lastPack].cost?'':'none';drawCoins(true)}});
 $('#openOv').classList.add('on')}
$('#openDone').onclick=()=>{SFX.tap();$('#openOv').classList.remove('on');drawShop()};
$('#openAgain').onclick=()=>{$('#openOv').classList.remove('on');buy(lastPack)};

/* =============== book =============== */
let bf=-1;
function drawBook(){const own=MON.filter(m=>S.owned[m.id]);const sh=own.filter(m=>S.owned[m.id]>=3).length,gd=own.filter(m=>S.owned[m.id]>=6).length;$('#bookTitle').textContent=`Critter Book ${own.length}/${MON.length}`+(sh?` · ✨${sh}`:'')+(gd?` · ★${gd}`:'');
 $('#chips').innerHTML=`<button class="chip${bf<0?' on':''}" data-f="-1">All</button>`+RAR.map((r,i)=>`<button class="chip${bf===i?' on':''}" data-f="${i}" style="${bf===i?'':`box-shadow:inset 0 0 0 3px ${r.c}`}">${r.n} ${own.filter(m=>m.rar===i).length}/${MON.filter(m=>m.rar===i).length}</button>`).join('');
 $$('.chip').forEach(b=>b.onclick=()=>{SFX.tap();bf=+b.dataset.f;drawBook()});
 $('#bgrid').innerHTML=MON.filter(m=>bf<0||m.rar===bf).map(m=>{const n=S.owned[m.id]|0;return `<button class="mc${n?'':' no'}" data-m="${m.id}" style="--r:${RAR[m.rar].c}">${n>1?`<span class="x">×${n}</span>`:''}${art(m.id,tierOf(n))}<div class="nm">${n?esc(m.name):'???'}</div><div class="rr">${RAR[m.rar].n}</div>${n>=3?`<div class="tier">${TIER[tierOf(n)]}</div>`:''}</button>`}).join('');
 $$('.mc').forEach(b=>b.onclick=()=>{const m=MON[+b.dataset.m];if(!S.owned[m.id]){SFX.bad();toast('Open packs to find it!');return}SFX.tap();
  const n=S.owned[m.id];$('#detArt').innerHTML=art(m.id,tierOf(n));$('#detName').textContent=m.name;$('#detInfo').innerHTML=`<div style="color:${RAR[m.rar].c};font-weight:800;filter:brightness(.8)">${RAR[m.rar].n} · ${TYPES[m.t].n} type</div><p>${esc(m.fact)}</p><div class="small">You have ${n} ${n>1?'copies':'copy'}${n>=3?` · ${TIER[tierOf(n)]}`:''}. ${n<3?`${3-n} more to make it Shiny.`:n<6?`${6-n} more to make it Golden.`:'It is fully powered up!'}</div>`;
  say(m.name+'. '+m.fact);$('#detOv').classList.add('on')})}
$('#detClose').onclick=()=>$('#detOv').classList.remove('on');

/* =============== grown-ups =============== */
const gear=$('#gear');let hold=0,ht=0;
function holdStop(){clearInterval(ht);hold=0;gear.classList.remove('hold');gear.style.setProperty('--p','0%')}
gear.addEventListener('pointerdown',e=>{e.preventDefault();holdStop();gear.classList.add('hold');ht=setInterval(()=>{hold+=5;gear.style.setProperty('--p',hold+'%');if(hold>=100){holdStop();openParent()}},75)});
['pointerup','pointerleave','pointercancel'].forEach(ev=>gear.addEventListener(ev,()=>{if(hold<100)holdStop()}));
gear.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' ')openParent()});
let ptab='stats',resetArm=false;
const pc=(a,b)=>b?Math.round(a/b*100):null;
const pcol=p=>p==null?'#eee':p>=90?'#c8f7c5':p>=70?'#fff1b8':'#ffd9d9';
function openParent(){resetArm=false;ptab='stats';drawParent();$('#parentOv').classList.add('on')}
function drawParent(){$$('#ptabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===ptab));const B=$('#pBody');
 if(ptab==='stats'){let tot=0,first=0;Object.values(S.stats).forEach(g=>Object.values(g).forEach(s=>{tot+=s.n;first+=s.first}));
  let h=`<h2>Max's progress</h2><p class="small">"First try" means he picked the right answer with no mistakes. Green is 90% or more (ready for harder), yellow is 70–89%, red is under 70% (could use practice). Use − and + to change a game's level.</p>
  <p><b>${tot}</b> questions answered · <b>${pc(first,tot)??0}%</b> right on the first try · ${S.coins} coins · ${Object.keys(S.owned).length}/${MON.length} critters · ${S.packs} packs opened</p><div class="tscroll"><table><thead><tr><th>Game</th><th>Level now</th><th class="n">Questions</th><th class="n">First try</th><th class="n">Mistakes</th><th>By level</th></tr></thead><tbody>`;
  for(const kind of['math','read']){h+=`<tr><td colspan="6"><b>${kind=='math'?'Math':'Reading'}</b></td></tr>`;
   GAMES.filter(g=>g.kind===kind).forEach(g=>{const st=gs(g.key),ss=S.stats[g.key]||{};let n=0,f=0,w=0;Object.values(ss).forEach(s=>{n+=s.n;f+=s.first;w+=s.wrong});const p=pc(f,n);
    const by=Object.keys(ss).sort((a,b)=>a-b).map(l=>{const s=ss[l],q=pc(s.first,s.n);return `<span class="pct" style="background:${pcol(q)}" title="Level ${l}">L${l}: ${q}%</span>`}).join(' ');
    h+=`<tr><td>${g.name}</td><td><span class="lv"><button data-lv="${g.key}" data-d="-1" aria-label="Lower level">−</button>${st.lvl}/${g.max}<button data-lv="${g.key}" data-d="1" aria-label="Raise level">+</button></span></td><td class="n">${n}</td><td class="n"><span class="pct" style="background:${pcol(p)}">${p==null?'–':p+'%'}</span></td><td class="n">${w}</td><td>${by||'<span class="small">not played yet</span>'}</td></tr>`})}
  h+=`</tbody></table></div>`;
  const tags=[];GAMES.forEach(g=>Object.entries(S.stats[g.key]||{}).forEach(([l,s])=>Object.entries(s.tags||{}).forEach(([t,v])=>tags.push({g:g.name,l,t,n:v[0],p:pc(v[1],v[0])}))));
  const agg={};tags.forEach(x=>{const k=x.g+'|'+x.t;agg[k]=agg[k]||{g:x.g,t:x.t,n:0,f:0};agg[k].n+=x.n;agg[k].f+=Math.round(x.p*x.n/100)});
  const rows=Object.values(agg).filter(x=>x.n>=3).sort((a,b)=>a.f/a.n-b.f/b.n);
  if(rows.length)h+=`<h3>By skill (3 or more tries)</h3><div class="tscroll"><table><thead><tr><th>Game</th><th>Skill</th><th class="n">Tries</th><th class="n">First try</th></tr></thead><tbody>${rows.map(x=>{const p=pc(x.f,x.n);return `<tr><td>${x.g}</td><td>${esc(x.t)}</td><td class="n">${x.n}</td><td class="n"><span class="pct" style="background:${pcol(p)}">${p}%</span></td></tr>`}).join('')}</tbody></table></div>`;
  B.innerHTML=h;B.querySelectorAll('[data-lv]').forEach(b=>b.onclick=()=>{const g=GKEY[b.dataset.lv],st=gs(g.key);st.lvl=Math.max(1,Math.min(g.max,st.lvl+ +b.dataset.d));st.prog=0;save();drawParent()})}
 else if(ptab==='log'){B.innerHTML=`<h2>Recent mistakes</h2><p class="small">The last ${S.log.length} wrong tries, newest first.</p>`+(S.log.length?`<div class="tscroll"><table><thead><tr><th>When</th><th>Game</th><th>Level</th><th>Question</th><th>He tried</th></tr></thead><tbody>${S.log.map(e=>`<tr><td>${new Date(e.t).toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}</td><td>${esc(GKEY[e.g]?.name||e.g)}</td><td>${e.l}</td><td style="white-space:normal">${esc(e.q)}</td><td>${esc(e.a)}</td></tr>`).join('')}</tbody></table></div>`:'<p>No mistakes yet!</p>')}
 else{B.innerHTML=`<h2>Settings</h2><button class="opt" id="oS">Sounds <b>${S.sound?'On':'Off'}</b></button><button class="opt" id="oV">Say "Great job!" out loud <b>${S.voice?'On':'Off'}</b></button>
  <button class="opt" id="oC">Give Max 100 coins <b>›</b></button><button class="opt warn" id="oR">${resetArm?'Tap again to erase everything':'Reset all progress'} <b>›</b></button>
  <p class="small">Coins: 5 for a right answer on the first try, 3 after one miss, 1 after more. 10 bonus coins every 5 right answers, or 20 when he reaches a new level. Repeat critters power up: 3 copies make a critter Shiny, 6 make it Golden, and copies after that give 5 coins. In Sign Puzzles, normal math order applies (× and ÷ first), but every puzzle also works left to right. On an iPad, the side silent switch mutes sounds.</p>`;
  $('#oS').onclick=()=>{S.sound=!S.sound;save();drawParent()};$('#oV').onclick=()=>{S.voice=!S.voice;save();drawParent()};
  $('#oC').onclick=()=>{S.coins+=100;save();drawCoins(true);toast('+100 coins')};
  $('#oR').onclick=()=>{if(!resetArm){resetArm=true;drawParent();return}const s=S.sound,v=S.voice;S=fresh();S.sound=s;S.voice=v;S.total=0;save();try{localStorage.removeItem(OLD)}catch(e){}resetArm=false;drawParent();drawCoins();toast('Progress erased')}}}
$$('#ptabs button').forEach(b=>b.onclick=()=>{ptab=b.dataset.t;resetArm=false;drawParent()});
$('#parentClose').onclick=()=>{$('#parentOv').classList.remove('on');refresh()};

/* =============== start =============== */
const sky=$('#sky');for(let j=0;j<50;j++){const s=document.createElement('i');s.style.left=Math.random()*100+'%';s.style.top=Math.random()*70+'%';s.style.animationDelay=Math.random()*3+'s';sky.appendChild(s)}
addEventListener('resize',()=>{if(R&&R.redraw&&$('#game').classList.contains('on'))R.redraw()});
window.__game={MON,GAMES,PACKS,art,get S(){return S},get R(){return R},openGame,rollRar,genSym,SYML};
drawHome();drawCoins();
}
</script>
</body>
</html>
